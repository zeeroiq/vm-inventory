spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5442/vminventory}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always
management.info.env.enabled=true

# GCP Configuration
gcp.client.mode=${GCP_CLIENT_MODE:mock}
gcp.sync.interval=${GCP_SYNC_INTERVAL:300000}

# Security & JWT
app.jwt.secret=${JWT_SECRET:vm-artifact-inventory-secret-key-32-chars-long-minimum!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
