steps:
  # 1. Run unit and integration tests with Maven
  - name: 'maven:3.9-eclipse-temurin-21'
    dir: 'backend'
    entrypoint: 'mvn'
    args: ['clean', 'test', '-B']

  # 2. Run frontend build and tests
  - name: 'node:20-alpine'
    dir: 'frontend'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        npm ci
        npm test -- --run
        npm run build

  # 3. Build backend container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_GAR_REPO/vm-inventory-backend:$SHORT_SHA'
      - '-t'
      - '$_GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_GAR_REPO/vm-inventory-backend:latest'
      - './backend'

  # 4. Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '$_GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_GAR_REPO/vm-inventory-backend'

  # 5. Deploy to Google Kubernetes Engine (GKE)
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - 'run'
      - '--filename=kubernetes/backend-deployment.yaml'
      - '--image=$_GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_GAR_REPO/vm-inventory-backend:$SHORT_SHA'
      - '--location=$_GKE_LOCATION'
      - '--cluster=$_GKE_CLUSTER'

  # 6. Post Deployment Metadata to VM Inventory API (Option 2 Discovery)
  - name: 'curlimages/curl:latest'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        curl -s -X POST "$_INVENTORY_API_URL/api/deployments" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer $$INVENTORY_API_TOKEN" \
          -d "{
            \"instanceId\": \"$_TARGET_INSTANCE_ID\",
            \"applicationName\": \"vm-inventory-backend\",
            \"artifactName\": \"vm-inventory.jar\",
            \"artifactVersion\": \"1.0.$BUILD_ID\",
            \"buildNumber\": \"#$BUILD_ID\",
            \"gitCommitId\": \"$SHORT_SHA\",
            \"branch\": \"$BRANCH_NAME\",
            \"deploymentSource\": \"Google Cloud Build\",
            \"deployedBy\": \"cloudbuild-sa@$PROJECT_ID.iam.gserviceaccount.com\",
            \"deploymentStatus\": \"SUCCESS\"
          }"
    secretEnv: ['INVENTORY_API_TOKEN']

substitutions:
  _GAR_LOCATION: 'us-central1'
  _GAR_REPO: 'vm-inventory-repo'
  _GKE_LOCATION: 'us-central1-a'
  _GKE_CLUSTER: 'prod-gke-cluster'
  _INVENTORY_API_URL: 'https://vm-inventory.internal'
  _TARGET_INSTANCE_ID: 'inst-prod-01'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/vm-inventory-api-token/versions/latest
      env: 'INVENTORY_API_TOKEN'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
