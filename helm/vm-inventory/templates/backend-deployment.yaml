apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vm-inventory.fullname" . }}-backend
  labels:
    app.kubernetes.io/name: {{ include "vm-inventory.name" . }}-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ include "vm-inventory.fullname" . }}-postgres:5432/{{ .Values.postgresql.database }}"
            - name: SPRING_DATASOURCE_USERNAME
              value: "{{ .Values.postgresql.username }}"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "{{ .Values.postgresql.password }}"
            - name: GCP_CLIENT_MODE
              value: "{{ .Values.backend.env.gcpClientMode }}"
            - name: GCP_SYNC_INTERVAL
              value: "{{ .Values.backend.env.syncInterval }}"
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vm-inventory.fullname" . }}-backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app: backend
