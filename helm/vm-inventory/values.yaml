global:
  environment: production

backend:
  replicaCount: 2
  image:
    repository: vm-artifact-inventory-backend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 512Mi
  env:
    gcpClientMode: "mock"
    syncInterval: "300000"

frontend:
  replicaCount: 2
  image:
    repository: vm-artifact-inventory-frontend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

postgresql:
  enabled: true
  database: vminventory
  username: admin
  password: password
  storage: 10Gi

ingress:
  enabled: true
  className: "nginx"
  host: "vm-inventory.example.com"
